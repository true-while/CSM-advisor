name: Release Cowork Plugin

# On every push to main this workflow picks the next version, builds dist/CSM-advisor.zip and
# publishes it as a GitHub Release tagged v<version>. The version is auto-incremented (patch)
# from the existing release tags; to start a new major/minor line, set e.g. "1.2.0" in
# manifest.json. The bumped manifest.json, SKILL.md and INSTALL.md are committed back to main
# (commits pushed with GITHUB_TOKEN do not re-trigger this workflow). A slim copy of the Microsoft
# Learn catalog is downloaded fresh into the skill folder for each build; it is bundled in the ZIP
# but not committed. Existing releases are never
# overwritten, and the "latest" release exposes a stable download link:
#   https://github.com/<owner>/<repo>/releases/latest/download/CSM-advisor.zip

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: |
          version="$(python3 scripts/next_version.py)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Next version: $version"

      - name: Update INSTALL.md with latest version
        run: python3 scripts/update_install_version.py "${{ steps.version.outputs.version }}" "${{ github.repository }}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json skills INSTALL.md
          if git diff --cached --quiet; then
            echo "No version changes to commit"
          else
            git commit -m "chore: release v${{ steps.version.outputs.version }} [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Download and slim Microsoft Learn catalog
        run: python3 scripts/build_learn_catalog.py

      - name: Build plugin ZIP
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Publish release v${{ steps.version.outputs.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            dist/CSM-advisor.zip \
            --repo "${{ github.repository }}" \
            --target "$(git rev-parse HEAD)" \
            --title "CSM Advisor v${{ steps.version.outputs.version }}" \
            --generate-notes \
            --notes "Automated release v${{ steps.version.outputs.version }}. Install via Cowork > Customize > Plugins > Add plugin."
